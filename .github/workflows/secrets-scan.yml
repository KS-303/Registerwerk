name: Geheimnisse pruefen (Gitleaks)

on:
  push:
    branches: [main, master, security/privacy-hardening]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Git-Historie auf Zugangsdaten pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository inklusive Historie holen
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks ausfuehren
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
