name: Windows-App bauen

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release-Entwurf erstellen
        required: false
        type: boolean
        default: false
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Version abgleichen
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Tag und package.json muessen dieselbe Version nennen.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Abhaengigkeiten installieren
        run: npm ci
      - name: Tests
        run: npm test
      - name: Electron starten und Oberflaeche pruefen
        run: npm run smoke
      - name: Windows-Installer und portable EXE bauen
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: EXE-Dateien und Update-Metadaten bereitstellen
        uses: actions/upload-artifact@v7
        with:
          name: Registerwerk-Windows-x64
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 30
      - name: App-Ordner ohne Selbstentpacken bereitstellen
        uses: actions/upload-artifact@v7
        with:
          name: Registerwerk-Windows-Ordner
          path: dist/win-unpacked/
          if-no-files-found: error
          retention-days: 30

  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.windows.outputs.version }}
    steps:
      - name: Gepruefte Dateien herunterladen und Release-Entwurf anlegen
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --name Registerwerk-Windows-x64 --dir release-files
          test -f release-files/latest.yml
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag existiert bereits. Fuer neue Dateien die Versionsnummer erhoehen."
            exit 1
          fi
          gh release create "$tag" release-files/* --target "$GITHUB_SHA" --draft --title "Registerwerk $VERSION" --generate-notes
